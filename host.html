<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>Host</title>
    <meta name="description" content="Polls, word clouds, quizzes and Q&amp;A for live sessions." />
    <meta name="robots" content="noindex" />
    <meta name="theme-color" content="#F4F0E8" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#16150F" media="(prefers-color-scheme: dark)" />
    <script>
      // Pre-paint theme: the presenter is dark unless the host picked light (live_kit_theme).
      ;(function () {
        var t = null
        try {
          t = JSON.parse(localStorage.getItem('live_kit_theme') || 'null')
        } catch (e) {}
        if (t !== 'light') document.documentElement.setAttribute('data-sds-theme', 'dark')
      })()
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main-host.tsx"></script>
  </body>
</html>
